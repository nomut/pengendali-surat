services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8000}:80'
    volumes:
      - '.:/var/www/html'
      - './docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf'
    networks:
      - internal
    depends_on:
      - laravel

  laravel:
    build:
      context: ./docker/local/web
      dockerfile: Dockerfile
      args:
        WWWUSER: '${WWWUSER:-1000}'
        WWWGROUP: '${WWWGROUP:-1000}'
    image: pkk-jogja/app
    restart: unless-stopped
    volumes:
      - '.:/var/www/html'
    networks:
      - internal
    depends_on:
      pgsql:
        condition: service_healthy

  pgsql:
    image: 'postgres:17'
    restart: unless-stopped
    environment:
      PGPASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'pkk-jogja-pgsql:/var/lib/postgresql/data'
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}" ]
      retries: 3
      timeout: 5s

volumes:
  pkk-jogja-pgsql:
    driver: local

networks:
  internal:
    driver: bridge
